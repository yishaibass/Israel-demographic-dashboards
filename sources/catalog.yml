unresolved:
  - id: education_school_level_2018_2023
    issue: No validated school-level funding and enrollment extract for both validation and production years.
    consequence: Education remains on the existing method until every material sector-by-decile cell meets the validation gate.
  - id: over_tax_authority_transactions_reuse
    issue: The OVER mirror did not state explicit redistribution terms.
    consequence: Keep detailed transaction extracts local; publish only methods and disclosure-safe aggregates.
  - id: insurancenet_redistribution
    issue: Retrieved portal metadata had a blank license field.
    consequence: Link to the source; do not commit the raw file.
